[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "theus"
version = "3.0.27"
description = "Reliable, Rust-Powered Agentic AI Framework with Transactional Memory."
authors = [{name = "Do Huy Hoang", email = "dohuyhoangvn93@gmail.com"}]
readme = "README.md"
requires-python = ">=3.12"
keywords = ["ai", "agents", "rust", "memory", "transactional", "safety", "pop", "framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typing-extensions>=4.0",
    "rich>=13.0",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/dohuyhoang93/theus"
Repository = "https://github.com/dohuyhoang93/theus"
Issues = "https://github.com/dohuyhoang93/theus/issues"

[project.scripts]
theus = "theus.cli:main"

[tool.maturin]
# "mixed" means we include both Python source code and Rust binary extension
features = ["pyo3/extension-module"]
# Python package lives in the theus/ subfolder
python-packages = ["theus"]
module-name = "theus_core"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
norecursedirs = ["tests/manual"]
python_files = ["test_*.py", "verify_*.py", "repro_*.py"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "target",
    "venv",
    ".venv",
    "Documents",
    "benchmarks",
    "examples",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Module level import not at top of file
    "E701",  # Multiple statements on one line (colon)
    "E722",  # Bare except used in defensive code paths
    "E501",  # Line too long (handled by line-length/formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401"]  # Tests can have unused imports for test setup



[tool.pyrefly]
project-includes = ["scripts"]
project-excludes = [
    "target",
    "examples",
    "benchmarks",
    "Documents",
    "tests",
    "theus/scaffold",
    "theus/structures.py",
    "theus/validator.py",
    "theus/workflow.py",
    "theus/schema_gen.py",
    "theus/theus_core.pyi",
]
python-version = "3.12.0"
infer-with-first-use = false
